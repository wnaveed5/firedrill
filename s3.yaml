apiVersion: v1
kind: Secret
metadata:
  name: s3-creds
stringData:
  ACCESS_KEY_ID: firedrill
  ACCESS_SECRET_KEY: firedrill
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: s3
spec:
  selector:
    matchLabels:
      app: s3
  template:
    metadata:
      labels:
        app: s3
    spec:
      enableServiceLinks: false
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          effect: NoSchedule
      containers:
        - name: s3
          image: chrislusf/seaweedfs:4.48
          args:
            - server
            - -dir=/data
            - -ip.bind=0.0.0.0
            - -s3
            - -s3.autoCreateBucket
            - -master.volumeSizeLimitMB=64
          ports:
            - containerPort: 8333
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: s3
spec:
  selector:
    app: s3
  ports:
    - port: 8333
